name: checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  script-lint:
    name: Script lint (bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (runs only when .sh scripts exist)
        run: |
          set -euo pipefail
          mapfile -t files < <(find projects -name '*.sh' -type f)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No bash scripts yet — nothing to lint."
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck "${files[@]}"
      # PowerShell lint (PSScriptAnalyzer) is added together with the first .ps1 script (P1 Phase 1).

  site:
    name: Site build and checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Placeholder + alt-text checks
        run: npm run check
      - name: Build site
        run: npm run build
      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          # 429 = rate limited, 999 = LinkedIn's bot block — both are "not broken", just unfriendly to checkers.
          args: --no-progress --max-concurrency 4 --accept 429,999 './site/dist/**/*.html'
          fail: true
